<!doctype html>
<html lang="{{config.lang}}">
<head>
<!-- GERADO por _montar.cjs. Página de saída (back redirect): {{p.saida}}. Checkout em config.checkoutSaida. -->
<meta charset="utf-8">
<!-- Rastreamento da oferta (cashflow / mentoriaprocesso), mesmo do index -->
<script src="https://cashflow.mentoriaprocesso.com/t/p.js?w=8bf6383c-9940-4837-a9d9-6e3cc6dcce06&o=9af13c22-ff5f-46bd-8723-9fdb3219527b" data-offer="9af13c22-ff5f-46bd-8723-9fdb3219527b" data-nowprocket data-no-minify="1" data-no-optimize="1" data-cfasync="false" async></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{promo.titulo}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B2340">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{config.pixelMeta}}');
fbq('track', 'PageView');
</script>
<!-- UTMify: script de rastreamento das UTMs (mesmo do index) -->
<script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
<!-- Fontes no próprio site (antes vinham do Google Fonts e travavam a primeira pintura). Mesmos arquivos, subconjunto latin. -->
<link rel="preload" as="font" type="font/woff2" href="{{base}}assets/fonts/inter-latin-v20.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{base}}assets/fonts/poppins-900-latin-v24.woff2" crossorigin>
<style>@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url({{base}}assets/fonts/inter-latin-v20.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url({{base}}assets/fonts/poppins-700-latin-v24.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:800;font-display:swap;src:url({{base}}assets/fonts/poppins-800-latin-v24.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:900;font-display:swap;src:url({{base}}assets/fonts/poppins-900-latin-v24.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}</style>
<style>
:root{--navy:#0B2340;--navy2:#12305A;--neon:#F28C1B;--ouro:#F28C1B;--verde:#18A058;--verde-esc:#12804A;--vermelho:#D93A3A;--tinta:#18232B;--cinza:#4A5B68;--borda:#DCE5EB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(120% 60% at 50% 0%,#1B3C6B 0%,var(--navy) 60%);background-color:var(--navy);color:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;height:auto;display:block}
.topo{background:var(--vermelho);color:#fff;font-weight:800;font-size:14px;text-align:center;padding:10px 14px}
.caixa{max-width:520px;margin:0 auto;padding:28px 16px 46px;text-align:center}
.pill{display:inline-block;border:1px solid rgba(242,140,27,.55);color:var(--neon);background:rgba(242,140,27,.08);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
h1{font-family:Poppins,Inter,sans-serif;font-size:clamp(28px,7.4vw,40px);font-weight:900;line-height:1.1;margin-top:14px}
h1 .n{color:var(--neon)}
.sub{color:#C9D7E0;margin-top:12px;font-size:16.5px}
.capa{width:80%;max-width:340px;margin:20px auto 0;border-radius:16px}
.cartao{background:#fff;color:var(--tinta);border-radius:22px;padding:22px;margin-top:22px;box-shadow:0 0 0 3px var(--neon),0 18px 40px rgba(0,0,0,.35)}
ul{list-style:none;text-align:left}
li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EAF0F3;font-weight:600;font-size:15px}
li::before{content:"✓";color:var(--verde);font-weight:900}
.de{margin-top:18px;color:var(--vermelho);font-weight:700}
.preco{font-family:Poppins,Inter,sans-serif;font-size:58px;font-weight:900;color:var(--navy);line-height:1.05}
.btn{display:block;margin-top:16px;text-decoration:none;background:linear-gradient(180deg,#1DB865,var(--verde-esc));color:#fff;font-weight:900;font-size:19px;text-transform:uppercase;padding:19px;border-radius:14px;box-shadow:0 10px 24px rgba(24,160,88,.38)}
.nota{font-size:13px;color:var(--cinza);margin-top:12px}
</style>
</head>
<body>
<div class="topo">{{promo.topo}}</div>
<main class="caixa">
  <span class="pill">{{promo.pill}}</span>
  <h1>{{promo.h1}}</h1>
  <p class="sub">{{promo.sub}}</p>
  <img class="capa" src="{{base}}assets/basico.webp" width="1000" height="1000" alt="{{meta.titulo}}">
  <div class="cartao">
    <ul>{{#promo.itens}}<li>{{.}}</li>{{/promo.itens}}</ul>
    <p class="de">{{promo.de}} <s>{{p.basico}}</s> {{promo.por}}</p>
    <div class="preco">{{p.saida}}</div>
    <!-- CHECKOUT Back Redirect ({{p.saida}}): config.checkoutSaida -->
    <a class="btn" data-checkout data-valor="{{config.precos.saida}}" href="{{config.checkoutSaida}}">{{promo.cta}}</a>
    <p class="nota">{{promo.nota}}</p>
  </div>
</main>
<script>
// leva as UTMs da campanha até o checkout e marca o InitiateCheckout
(function () {
  var q = location.search.replace(/^\?/, '').replace(/(^|&)refs(=[^&]*)?/, '');
  document.querySelectorAll('a[data-checkout]').forEach(function (a) {
    var h = a.getAttribute('href') || '';
    if (q && /^https?:/.test(h)) a.href = h + (h.indexOf('?') >= 0 ? '&' : '?') + q;
    a.addEventListener('click', function () {
      try { fbq('track', 'InitiateCheckout', { value: {{config.precos.saida}}, currency: 'BRL' }); } catch (e) {}
    });
  });
})();
</script>
</body>
</html>
